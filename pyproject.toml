[project]
name = "antialias"
version = "0.1.0"
description = "Invoke your bash functions from one place."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click~=8.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "ruff>=0.8.0",
    "ty>=0.0.32",
]

[project.scripts]
antialias = "antialias.__main__:cli"
